<svg xmlns="http://www.w3.org/2000/svg" width="1128" height="191" viewBox="0 0 1128 191" fill="none">
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1128" y2="191" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141312"/>
      <stop offset="55%" stop-color="#1f1d1b"/>
      <stop offset="100%" stop-color="#2a2624"/>
    </linearGradient>
    <pattern id="hatch" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="24" stroke="#f8ece8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="petal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dfa0aa"/>
      <stop offset="100%" stop-color="#c45c6a"/>
    </linearGradient>
  </defs>
  <rect width="1128" height="191" fill="url(#bannerBg)"/>
  <rect width="1128" height="191" fill="url(#hatch)"/>
  <rect x="0" y="0" width="420" height="191" fill="#f9e9e5" opacity="0.04"/>

  <text x="56" y="98" fill="#f8ece8" font-family="Georgia, 'Times New Roman', serif" font-size="54" letter-spacing="-1">Gizakura</text>
  <text x="58" y="132" fill="#a8a098" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="2.5">THE STUDIO BEHIND RESUMURAI</text>

  <g transform="translate(980 96)" opacity="0.9">
    <ellipse cx="0" cy="-34" rx="16" ry="26" fill="url(#petal)" transform="rotate(0)"/>
    <ellipse cx="0" cy="-34" rx="16" ry="26" fill="url(#petal)" transform="rotate(72)"/>
    <ellipse cx="0" cy="-34" rx="16" ry="26" fill="url(#petal)" transform="rotate(144)"/>
    <ellipse cx="0" cy="-34" rx="16" ry="26" fill="url(#petal)" transform="rotate(216)"/>
    <ellipse cx="0" cy="-34" rx="16" ry="26" fill="url(#petal)" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="8" fill="#f8ece8" opacity="0.85"/>
  </g>

  <g transform="translate(1060 48)" opacity="0.45">
    <ellipse cx="0" cy="-18" rx="9" ry="14" fill="url(#petal)" transform="rotate(18)"/>
    <ellipse cx="0" cy="-18" rx="9" ry="14" fill="url(#petal)" transform="rotate(90)"/>
    <ellipse cx="0" cy="-18" rx="9" ry="14" fill="url(#petal)" transform="rotate(162)"/>
    <ellipse cx="0" cy="-18" rx="9" ry="14" fill="url(#petal)" transform="rotate(234)"/>
    <ellipse cx="0" cy="-18" rx="9" ry="14" fill="url(#petal)" transform="rotate(306)"/>
    <circle cx="0" cy="0" r="4" fill="#f8ece8"/>
  </g>
